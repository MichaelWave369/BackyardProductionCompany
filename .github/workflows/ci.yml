name: Verify Studio Lot
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Test inventory
        run: npm test
      - name: Build dashboard
        run: npm run build
      - name: Check site artifact
        run: test -s dist/index.html
