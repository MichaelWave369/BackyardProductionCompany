name: Verify Studio Lot
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Test inventory
        run: npm test
      - name: Build dashboard
        run: npm run build
      - name: Check site artifact
        run: test -s dist/index.html

  # This job imports the source exporter AND the source receiver from their
  # upstream repositories. Pin SHAs to prevent silently changing contract
  # semantics; upgrades are reviewed as their own BPC PR.
  interop-acceptance:
    name: Framefield → Domistika XR actual contract
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out BPC orchestrator
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Check out verified Framefield source
        uses: actions/checkout@v4
        with:
          repository: MichaelWave369/FramefieldStudio
          ref: 196050ccfdd357d694871356dc6fcf6146f4b7af
          path: .interop/framefield
          persist-credentials: false
      - name: Check out verified Domistika receiver
        uses: actions/checkout@v4
        with:
          repository: MichaelWave369/Domistika
          ref: 75aff934b44bb7df053e8c881054bb1d4eb1fbfe
          path: .interop/domistika
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Test real producer-to-consumer handoff
        run: node --test tests/interop-crossrepo.mjs
